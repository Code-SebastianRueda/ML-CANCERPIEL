# ============================================
# Docker Compose - Skin Cancer Classifier
# ============================================
# Ejecutar desde la carpeta docker/:
#   docker-compose up --build
# Acceder: http://localhost:8501

services:
  skin-cancer-app:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    container_name: skin-cancer-classifier
    ports:
      - "8501:8501"
    volumes:
      - ../models:/app/models:ro
    environment:
      - TF_CPP_MIN_LOG_LEVEL=2
      - STREAMLIT_SERVER_MAX_UPLOAD_SIZE=10
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 4G
